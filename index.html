<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Açaí Central">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Açaí Control Central V1.5</title>
<style>
:root{--g:#0f3d2e;--g2:#146c43;--bg:#eef7ef;--card:#fff;--ink:#122318;--mut:#5f7167;--line:#cfe3d4;--red:#b42318;--yel:#8a6d00;--blue:#0b5cad}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif} header{background:linear-gradient(135deg,#0f3d2e,#166d3b);color:white;padding:18px 14px} h1{margin:0;font-size:24px}.sub{opacity:.9;margin-top:4px}.wrap{max-width:1240px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{font-weight:700;font-size:13px;display:block;margin:4px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #bad3c1;border-radius:10px;background:#fff;font-size:15px}textarea{min-height:80px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#dfeee3;color:#123;cursor:pointer}.btn.primary{background:var(--g2);color:white}.btn.warn{background:#ffe8a3}.btn.danger{background:#ffd7d7;color:#721c24}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;border:0;border-radius:999px;padding:10px 14px;background:#dbeadc;font-weight:700}.tabs .active{background:var(--g);color:white}.mut{color:var(--mut)}.ok{color:var(--g2);font-weight:700}.bad{color:var(--red);font-weight:700}.kpi{background:#f5fbf6;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{font-size:22px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e3efe6;padding:8px;text-align:left;vertical-align:top}th{background:#f2f8f3}.svgbox{height:470px;background:#06150c;border-radius:14px;position:relative;overflow:hidden}.mapbar{position:absolute;z-index:2;right:8px;top:8px}.fullscreen-map{position:fixed!important;z-index:9999;left:0;top:0;width:100vw!important;height:100vh!important;border-radius:0!important}.no-scroll{overflow:hidden}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e6f3ea;margin:2px;font-weight:700}.copybox{font-family:monospace;background:#07150d;color:#d7ffe0;padding:12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}.small{font-size:12px}
@media(max-width:760px){.grid,.grid2,.grid4{grid-template-columns:1fr}.wrap{padding:8px}h1{font-size:20px}.card{padding:12px}.svgbox{height:360px}}
</style>
</head>
<body>
<header><h1>🌿 Açaí Control Central V1.5</h1><div class="sub">Central Fazenda • Consultoria • Gerador de Chaves/PIN • Android/iOS</div></header>
<div class="wrap">
  <div class="card">
    <div class="grid">
      <div><label>URL Apps Script</label><input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div><label>Modo</label><select id="modo" onchange="salvarCfg();render()"><option value="FAZENDA">Central da Fazenda</option><option value="CONSULTORIA">Central da Consultoria</option></select></div>
      <div><label>CHAVE_FAZENDA / Central Fazenda</label><input id="chave" placeholder="ACAI-..."></div>
      <div><label>CONSULTORIA_ID / Central Consultoria</label><input id="consultoria" value="CONS-REPROGEN"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn primary" onclick="carregar()">Carregar dados</button><button class="btn" onclick="salvarCfg()">Salvar config</button><button class="btn" onclick="exportarCSV()">Exportar vendas CSV</button></div>
    <p class="mut" id="status"></p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<script>
(function(){'use strict';
var APP='ACAI_CONTROL_CENTRAL_V15',TELA=28,tab='dashboard';
var data={vendas:[],gastos:[],clientes:[],talhoes:[],propriedades:[],lancadores:[],alertas:[],fazendas:[],consultorias:[],proprietarios:[],chaves_acesso:[],dispositivos:[],usuarios:[]};
var cfg={apiUrl:'',modo:'FAZENDA',chave:'',consultoria:'CONS-REPROGEN'};
function gid(x){return document.getElementById(x)}; function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function num(v){var n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:n}; function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
function stat(s){gid('status').innerHTML=s}; function today(){return new Date().toISOString().slice(0,10)};
function loadCfg(){try{Object.assign(cfg,JSON.parse(localStorage.getItem(APP)||'{}'))}catch(e){}}; function saveCfg(){cfg.apiUrl=gid('apiUrl').value.trim();cfg.modo=gid('modo').value;cfg.chave=gid('chave').value.trim();cfg.consultoria=gid('consultoria').value.trim()||'CONS-REPROGEN';localStorage.setItem(APP,JSON.stringify(cfg))};
window.salvarCfg=function(){saveCfg();stat('Configuração salva.')}; function fillCfg(){gid('apiUrl').value=cfg.apiUrl;gid('modo').value=cfg.modo;gid('chave').value=cfg.chave;gid('consultoria').value=cfg.consultoria};
var tabs=[['dashboard','Dashboard'],['acessos','Chaves e senhas'],['fazendas','Fazendas'],['vendas','Vendas'],['gastos','Gastos'],['talhoes','Talhões'],['mapa','Mapa'],['relatorios','Relatórios'],['alertas','Alertas']];
function renderTabs(){gid('tabs').innerHTML=tabs.map(function(t){return '<button class="'+(tab===t[0]?'active':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')};
window.setTab=function(t){tab=t;render()};
function filtro(arr){arr=arr||[]; if(cfg.modo==='FAZENDA'&&cfg.chave)return arr.filter(function(x){return !x.chave_fazenda||String(x.chave_fazenda)===cfg.chave}); if(cfg.modo==='CONSULTORIA'&&cfg.consultoria)return arr.filter(function(x){return !x.consultoria_id||String(x.consultoria_id)===cfg.consultoria}); return arr};
function sum(a,k){return (a||[]).reduce(function(s,x){return s+num(x[k])},0)}; function uniq(a,k){var m={};(a||[]).forEach(function(x){if(x[k])m[x[k]]=1});return Object.keys(m).length};
window.carregar=function(){saveCfg(); if(!cfg.apiUrl)return alert('Informe a URL do Apps Script.'); var action=cfg.modo==='FAZENDA'?'dadosFazenda&chave_fazenda='+encodeURIComponent(cfg.chave):'dadosConsultoria&consultoria_id='+encodeURIComponent(cfg.consultoria); stat('Carregando...'); fetch(cfg.apiUrl+'?action='+action).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.message||'Falha'); data=j.data||j; stat('Dados carregados: '+new Date().toLocaleString('pt-BR')); render()}).catch(function(e){stat('<span class="bad">Erro: '+esc(e.message)+'</span>')})};
function render(){renderTabs(); var m={dashboard:viewDashboard,acessos:viewAcessos,fazendas:function(){return cardTable('Fazendas',filtro(data.fazendas))},vendas:function(){return cardTable('Vendas',filtro(data.vendas))},gastos:function(){return cardTable('Gastos',filtro(data.gastos))},talhoes:function(){return cardTable('Talhões',filtro(data.talhoes))},mapa:viewMapa,relatorios:viewRelatorios,alertas:function(){return cardTable('Alertas',filtro(data.alertas))}}; gid('view').innerHTML=(m[tab]||viewDashboard)()};
function viewDashboard(){var v=filtro(data.vendas).filter(function(x){return x.status!=='CANCELADO'}),g=filtro(data.gastos).filter(function(x){return x.status!=='CANCELADO'}),rec=sum(v,'valor_liquido'),gas=sum(g,'valor'),kg=sum(v,'kg_total'),pend=sum(v,'valor_pendente');return '<div class="grid4"><div class="kpi">Fazendas<br><b>'+uniq(v.concat(g),'chave_fazenda')+'</b></div><div class="kpi">Kg vendidos<br><b>'+kg.toFixed(1)+'</b><br><span class="mut">'+(kg/TELA).toFixed(2)+' telas</span></div><div class="kpi">Receita<br><b>'+brl(rec)+'</b></div><div class="kpi">Gastos<br><b>'+brl(gas)+'</b></div><div class="kpi">Lucro estimado<br><b>'+brl(rec-gas)+'</b></div><div class="kpi">Valor pendente<br><b>'+brl(pend)+'</b></div><div class="kpi">Preço médio/kg<br><b>'+brl(kg?rec/kg:0)+'</b></div><div class="kpi">Alertas<br><b>'+filtro(data.alertas).length+'</b></div></div><div class="card"><h2>Ranking por fazenda</h2>'+rankingFazenda()+'</div><div class="card"><h2>Últimas vendas</h2>'+table(v.slice(-10).reverse())+'</div>'};
function viewAcessos(){var disabled=cfg.modo!=='CONSULTORIA'?' disabled ':'';return '<div class="card"><h2>Gerador de chave e PIN da fazenda</h2><p class="mut">Use na Central da Consultoria. A chave e o PIN serão gravados nas abas FAZENDAS, CHAVES_ACESSO e PROPRIETARIOS, quando necessário.</p>'+(cfg.modo!=='CONSULTORIA'?'<p class="bad">Mude para Central da Consultoria para gerar novas chaves.</p>':'')+'<div class="grid"><div><label>Nome da fazenda</label><input id="gf_nome" placeholder="Fazenda Boa Esperança"></div><div><label>Proprietário</label><input id="gf_prop" placeholder="João Silva"></div><div><label>Telefone proprietário</label><input id="gf_tel" placeholder="(91) ..."></div><div><label>Município</label><input id="gf_mun" placeholder="Irituia"></div><div><label>Comunidade/localidade</label><input id="gf_com" placeholder="Comunidade"></div><div><label>Área total ha</label><input id="gf_area" type="number" step="0.01"></div><div><label>Consultoria ID</label><input id="gf_cons" value="'+esc(cfg.consultoria)+'"></div><div><label>Validade</label><input id="gf_val" type="date" value="2026-12-31"></div></div><div class="row" style="margin-top:10px"><button class="btn primary" '+disabled+' onclick="gerarChaveCentral()">Gerar e gravar chave/PIN</button><button class="btn" onclick="gerarPreviewLocal()">Prévia local</button><button class="btn" onclick="copiarCartao()">Copiar cartão</button></div><p id="gf_status" class="mut"></p><div id="cartaoChave" class="copybox">Nenhuma chave gerada ainda.</div></div><div class="card"><h2>Chaves cadastradas</h2>'+table(filtro(data.chaves_acesso||[]))+'</div><div class="card"><h2>Dispositivos ativados</h2>'+table(filtro(data.dispositivos||[]))+'</div>'};
function slug(s){return String(s||'FAZENDA').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,18)||'FAZENDA'}; function rnd(n){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}; function pin(){return String(Math.floor(1000+Math.random()*9000))};
function buildCard(o){return 'AÇAÍ CONTROL — ACESSO DA FAZENDA\n\nFazenda: '+(o.fazenda_nome||'')+'\nProprietário: '+(o.proprietario_nome||'')+'\nMunicípio: '+(o.municipio||'')+'\n\nCHAVE_FAZENDA:\n'+(o.chave_fazenda||'')+'\n\nPIN:\n'+(o.pin||'')+'\n\nLink App Campo: [colar link do GitHub Pages]\nLink Central da Fazenda: [colar link do GitHub Pages]\n\nGuarde esta chave. Ela identifica a fazenda no sistema.'};
window.gerarPreviewLocal=function(){var nome=gid('gf_nome').value||'FAZENDA'; var o={fazenda_nome:nome,proprietario_nome:gid('gf_prop').value,municipio:gid('gf_mun').value,chave_fazenda:'ACAI-'+slug(nome)+'-'+rnd(4)+'-'+new Date().getFullYear(),pin:pin()}; gid('cartaoChave').textContent=buildCard(o); gid('gf_status').innerHTML='Prévia gerada localmente. Para gravar na planilha, use Gerar e gravar chave/PIN.'};
window.gerarChaveCentral=function(){saveCfg(); if(!cfg.apiUrl)return alert('Informe URL Apps Script.'); var payload={fazenda_nome:gid('gf_nome').value.trim(),proprietario_nome:gid('gf_prop').value.trim(),telefone:gid('gf_tel').value.trim(),municipio:gid('gf_mun').value.trim(),comunidade:gid('gf_com').value.trim(),area_total_ha:gid('gf_area').value,consultoria_id:gid('gf_cons').value.trim()||cfg.consultoria,consultoria_nome:'Reprogen / Tomaz Pina Maia',validade:gid('gf_val').value||'2026-12-31'}; if(!payload.fazenda_nome||!payload.proprietario_nome)return alert('Informe fazenda e proprietário.'); gid('gf_status').innerHTML='Gerando...'; fetch(cfg.apiUrl,{method:'POST',body:JSON.stringify({action:'gerarChaveFazenda',payload:payload})}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.message||'Falha ao gerar chave'); var o=j.acesso||j.data||{}; gid('cartaoChave').textContent=buildCard(o); gid('gf_status').innerHTML='<span class="ok">Chave/PIN gerados e gravados.</span>'; carregar();}).catch(function(e){gid('gf_status').innerHTML='<span class="bad">Erro: '+esc(e.message)+'</span>'})};
window.copiarCartao=function(){var t=gid('cartaoChave').textContent; if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert('Cartão copiado.')}); else {var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Cartão copiado.')}};
function rankingFazenda(){var rows={};filtro(data.vendas).forEach(function(v){var k=v.chave_fazenda||'SEM_CHAVE'; if(!rows[k])rows[k]={fazenda:v.fazenda_nome||k,kg:0,receita:0,gastos:0}; rows[k].kg+=num(v.kg_total); rows[k].receita+=num(v.valor_liquido)}); filtro(data.gastos).forEach(function(g){var k=g.chave_fazenda||'SEM_CHAVE'; if(!rows[k])rows[k]={fazenda:g.fazenda_nome||k,kg:0,receita:0,gastos:0}; rows[k].gastos+=num(g.valor)}); return table(Object.keys(rows).map(function(k){var r=rows[k];return {fazenda:r.fazenda,chave:k,kg:r.kg.toFixed(1),receita:brl(r.receita),gastos:brl(r.gastos),lucro:brl(r.receita-r.gastos)}}))};
function cardTable(t,a){return '<div class="card"><h2>'+t+'</h2>'+table(a)+'</div>'}; function table(a){if(!a||!a.length)return '<p class="mut">Sem registros.</p>'; var cols=Object.keys(a[0]).slice(0,18); return '<div style="overflow:auto"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+a.map(function(o){return '<tr>'+cols.map(function(c){return '<td>'+esc(o[c])+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'};
function metTalhao(t){var vs=filtro(data.vendas).filter(function(v){return v.talhao_id===t.id}),gs=filtro(data.gastos).filter(function(g){return g.talhao_id===t.id}); var kg=sum(vs,'kg_total'),rec=sum(vs,'valor_liquido'),gas=sum(gs,'valor'),area=num(t.area_ha);return {kg:kg,telas:kg/TELA,receita:rec,gastos:gas,lucro:rec-gas,kgHa:area?kg/area:0,lucroHa:area?(rec-gas)/area:0}};
function viewMapa(){var ts=filtro(data.talhoes).map(function(t){var coords=[];try{var g=JSON.parse(t.geojson||'{}');coords=(g.coordinates&&g.coordinates[0]||[]).map(function(c){return [num(c[0]),num(c[1])]})}catch(e){}return {id:t.id,nome:t.nome||t.talhao_nome,fazenda:t.fazenda_nome,chave:t.chave_fazenda,coords:coords,m:metTalhao(t)}}).filter(function(t){return t.coords.length>=3});return '<div class="card"><h2>Mapa produtivo '+(cfg.modo==='CONSULTORIA'?'multi-fazenda':'da fazenda')+'</h2><p class="mut">Clique em um talhão para obter dados produtivos e financeiros.</p><div class="row" style="margin:8px 0"><button class="btn" onclick="toggleMapaFull()">Abrir mapa em tela cheia</button></div><div id="mapArea" class="svgbox"><div class="mapbar"><button class="btn" onclick="toggleMapaFull()">Tela cheia / sair</button></div>'+svg(ts)+'</div><div id="infoTalhao" class="card"><span class="mut">Clique em um talhão.</span></div></div>'};
function svg(list){if(!list.length)return '<p class="mut" style="padding:12px">Nenhum talhão poligonal carregado.</p>';var all=[];list.forEach(function(p){all=all.concat(p.coords)});var xs=all.map(function(c){return c[0]}),ys=all.map(function(c){return c[1]});var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys),w=1100,h=450,pad=30;function X(x){return pad+(x-minx)/((maxx-minx)||1)*(w-2*pad)};function Y(y){return h-(pad+(y-miny)/((maxy-miny)||1)*(h-2*pad))};var s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="100%"><rect width="100%" height="100%" fill="#06150c"/>';list.forEach(function(p){var fill=!p.m.kg?'rgba(170,170,170,.30)':p.m.lucro<0?'rgba(239,107,107,.38)':'rgba(54,179,107,.38)',pts=p.coords.map(function(c){return X(c[0])+','+Y(c[1])}).join(' ');s+='<polygon points="'+pts+'" fill="'+fill+'" stroke="#77d18d" stroke-width="3" style="cursor:pointer" onclick="abrirTalhao(\''+esc(p.id)+'\')"><title>'+esc(p.nome)+' • '+esc(p.fazenda)+' • '+p.m.kg.toFixed(0)+' kg</title></polygon><text x="'+X(p.coords[0][0])+'" y="'+Y(p.coords[0][1])+'" fill="#fff" font-weight="bold">'+esc(p.nome)+'</text><text x="'+X(p.coords[0][0])+'" y="'+(Y(p.coords[0][1])+16)+'" fill="#b7d5bf" font-size="12">'+esc(p.fazenda||'')+'</text>'});return s+'</svg>'};
window.abrirTalhao=function(id){var t=filtro(data.talhoes).find(function(x){return x.id===id}); if(!t)return; var m=metTalhao(t); gid('infoTalhao').innerHTML='<h2>'+esc(t.nome)+'</h2><p class="mut">Fazenda: '+esc(t.fazenda_nome)+' • Chave: '+esc(t.chave_fazenda)+'</p><div class="grid4"><div class="kpi">Área<br><b>'+num(t.area_ha).toFixed(2)+' ha</b></div><div class="kpi">Produção<br><b>'+m.kg.toFixed(1)+' kg</b></div><div class="kpi">Kg/ha<br><b>'+m.kgHa.toFixed(1)+'</b></div><div class="kpi">Receita<br><b>'+brl(m.receita)+'</b></div><div class="kpi">Gastos<br><b>'+brl(m.gastos)+'</b></div><div class="kpi">Lucro<br><b>'+brl(m.lucro)+'</b></div><div class="kpi">Lucro/ha<br><b>'+brl(m.lucroHa)+'</b></div><div class="kpi">Telas<br><b>'+m.telas.toFixed(2)+'</b></div></div>'};
window.toggleMapaFull=function(){var el=gid('mapArea'); if(!el)return; el.classList.toggle('fullscreen-map'); document.body.classList.toggle('no-scroll',el.classList.contains('fullscreen-map'))};
function viewRelatorios(){return '<div class="card"><h2>Relatórios multi-fazenda</h2><h3>Comparativo por fazenda</h3>'+rankingFazenda()+'<h3>Talhões</h3>'+table(filtro(data.talhoes).map(function(t){var m=metTalhao(t);return {fazenda:t.fazenda_nome,talhao:t.nome,area_ha:t.area_ha,kg:m.kg.toFixed(1),kg_ha:m.kgHa.toFixed(1),receita:brl(m.receita),gastos:brl(m.gastos),lucro:brl(m.lucro)}}))+'</div>'};
window.exportarCSV=function(){var arr=filtro(data.vendas); if(!arr.length)return alert('Sem vendas.'); var cols=Object.keys(arr[0]); var csv=[cols.join(';')].concat(arr.map(function(o){return cols.map(function(c){return '"'+String(o[c]||'').replace(/"/g,'""')+'"'}).join(';')})).join('\n'); var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='acai_vendas.csv'; a.click()};
loadCfg(); fillCfg(); render();
})();
</script>
</body></html>
